server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static hashed assets: cache aggressively
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker / PWA assets handled fresh enough; short cache
    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API: forward to the Spring Boot backend, preserving the /api prefix.
    # The backend maps handlers directly at /api/... (e.g. /api/auth/login).
    location /api/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # SPA fallback: client-side routing must survive browser refresh
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html aggressively
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
