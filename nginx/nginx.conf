# =====================================================================
# Zyger ERP — Staging Reverse Proxy
# Only this Nginx is publicly exposed (host port 80).
# Routes:
#   /           -> frontend static application
#   /api/       -> Spring Boot backend (preserves the /api prefix)
#   /actuator/health -> backend health (only readiness; everything else denied)
# =====================================================================

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:9090;
}

server {
    listen 80;
    server_name _;

    # Security headers (kept SPA-compatible; no CSP that would break the app)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Upload limit — must match Spring Boot multipart (10MB)
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # ---- Static assets: delegate to frontend nginx (has its own caching/SPA fallback) ----
    location /assets/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API -> Spring Boot backend ----
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # ---- Actuator: expose ONLY health/readiness for monitoring; block the rest ----
    location = /actuator/health {
        proxy_pass http://backend_upstream/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health/readiness {
        proxy_pass http://backend_upstream/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        return 403;
    }

    # ---- Everything else -> frontend SPA (frontend nginx applies its own SPA fallback) ----
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
