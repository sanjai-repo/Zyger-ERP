services:
  database:
    image: postgres:16-alpine
    container_name: Zyger-ERP-Database
    environment:
      POSTGRES_DB: zyger_erp
      POSTGRES_USER: zyger
      POSTGRES_PASSWORD: zyger123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - zyger-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyger -d zyger_erp"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./zygererp
      target: runtime
    image: zygererp-backend
    container_name: Zyger-ERP-Backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://database:5432/zyger_erp
      DB_USERNAME: zyger
      DB_PASSWORD: zyger123
      SERVER_PORT: "9090"
      CORS_ORIGINS: http://localhost,http://localhost:8081,http://localhost:9091
      JWT_SECRET: change-me-in-production-use-a-256-bit-random-string
      JWT_EXPIRATION_MS: "3600000"
    ports:
      - "9090:9090"
    networks:
      - zyger-net
    restart: unless-stopped

  frontend:
    build:
      context: ./zyger-erp-frontend
    image: zygererp-frontend
    container_name: Zyger-ERP-Frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - zyger-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  zyger-net:
    name: zyger-net
