services:
  db:
    image: postgres:16-alpine
    container_name: zyger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zyger_erp
      POSTGRES_USER: zyger
      POSTGRES_PASSWORD: zyger123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyger -d zyger_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./zygererp
      dockerfile: Dockerfile
    container_name: zyger-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/zyger_erp
      DB_USERNAME: zyger
      DB_PASSWORD: zyger123
      SERVER_PORT: "9090"
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: zyger-erp-docker-jwt-secret-key-change-in-production-2026
      JWT_EXPIRATION_MS: "3600000"
      CORS_ORIGINS: "http://localhost,http://localhost:80"
      PASSWORD_MIN_LENGTH: "8"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCKOUT_MINUTES: "15"
      JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  frontend:
    build:
      context: ./zyger-erp-frontend
      dockerfile: Dockerfile
    container_name: zyger-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
